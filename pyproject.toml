[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questionnaire-chatbot-prototype"
version = "0.1.0"
description = "Scaffold for a virtual questionnaire chatbot prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]
